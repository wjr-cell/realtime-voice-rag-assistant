[project]
name = "rag-llm-server"
version = "0.1.0"
description = "Auth, RTC voice chat proxy, and knowledge-base LLM server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pwdlib[argon2]>=0.2.1,<1",
    "python-dotenv==1.0.1",
    "uvicorn[standard]==0.32.0",
    "volcengine-python-sdk[ark]>=5.0.3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
